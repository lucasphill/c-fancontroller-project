name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run tests without hardware access
        run: ./tools/test.ps1
      - name: Build CLI
        run: ./tools/build.ps1
      - name: Build GUI
        run: ./tools/build-gui.ps1
      - name: Package Windows x64
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/aeri.exe, build/fanctl.exe, build/PresentMon-LICENSE.txt, build/PresentMon-THIRD-PARTY.txt, build/WebView2-LICENSE.txt, README.md -Destination dist
          Compress-Archive -Path dist/* -DestinationPath aeri-windows-x64.zip
          Move-Item aeri-windows-x64.zip dist/
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aeri-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $notes = "Build Windows x64 do commit $env:GITHUB_SHA. Baixe aeri.exe (interface), fanctl.exe (CLI) ou o ZIP com ambos e as licencas. Esta distribuicao portatil nao inclui instalador nem configura inicio automatico."
          gh release create $tag dist/* --target $env:GITHUB_SHA --title "Windows x64 - $tag" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
